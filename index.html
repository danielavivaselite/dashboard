<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>DV Dashboard</title>
<link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;600&display=swap' rel='stylesheet'>
<style>
:root{--gold:#C9A85B;--bg:#090909;--card:#111;--text:#F5F2EA}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
.container{max-width:1100px;margin:auto;padding:40px 24px}
header{text-align:center}.logo{width:110px}.badge{display:inline-block;margin:20px 0;border:1px solid var(--gold);padding:8px 16px;border-radius:30px;color:var(--gold)}
h1{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:56px;margin:10px 0}.sub{letter-spacing:3px}
.search{width:100%%;padding:14px;background:#111;border:1px solid var(--gold);border-radius:12px;color:#fff}
details{margin-top:18px;border:1px solid #2b2b2b;border-radius:16px;background:#0f0f0f}
summary{padding:18px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:24px;cursor:pointer}
.cards{padding:0 16px 16px}
.card{display:flex;justify-content:space-between;align-items:center;background:#171717;border:1px solid #292929;border-radius:12px;padding:16px;margin-top:12px;gap:12px}
.card:hover{border-color:var(--gold)}
.url{font-size:.8rem;color:#999;word-break:break-all}
.actions{display:flex;gap:10px}
.open,.copy{padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:bold}
.open{background:var(--gold);color:#111}.copy{background:transparent;color:var(--gold);border:1px solid var(--gold)}
footer{text-align:center;color:#777;margin:50px}
</style></head><body><div class='container'>
